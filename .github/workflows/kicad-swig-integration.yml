---
name: KiCad SWIG Integration

on: # yamllint disable-line rule:truthy
  pull_request:
  workflow_dispatch:

jobs:
  kicad-swig-tests-matrix:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: kicad9
            experimental: false
            image: ghcr.io/inti-cmnb/kicad9_auto_full:latest
            verify_label: "KiCad 9"
            k_expr: ""
          - lane: kicad10
            experimental: true
            image: ghcr.io/inti-cmnb/kicad_auto_full@sha256:a3a52fba4144e2ac72a893845409f316e9f64eb843d1cbbe91b8f51a8758865a
            verify_label: "KiCad 10"
            k_expr: "fixture_manifest_paths_exist or all_smoke_fixtures_load_and_enumerate"
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify KiCad pcbnew bindings
        run: |
          python3 -V
          python3 -c "import pcbnew; print('${{ matrix.verify_label }} pcbnew import ok:', pcbnew.GetBuildVersion())"

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install .

      - name: Run KiCad SWIG integration tests
        run: |
          if [ -n "${{ matrix.k_expr }}" ]; then
            pytest -m kicad_integration tests/test_kicad_swig_integration.py -k "${{ matrix.k_expr }}"
          else
            pytest -m kicad_integration tests/test_kicad_swig_integration.py
          fi

  ui-smoke-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/inti-cmnb/kicad9_auto_full:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify wx + KiCad runtime
        run: |
          python3 -V
          python3 -c "import wx; print('wx import ok')"
          python3 -c "import pcbnew; print('pcbnew import ok')"

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install .

      - name: Run UI smoke tests
        run: |
          pytest -m ui_smoke tests/test_ui_smoke_harness.py

